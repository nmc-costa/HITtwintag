<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Twin Annotator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
            touch-action: none; /* Disables browser panning to allow custom canvas panning */
            overflow: hidden;
            background-color: #f8fafc;
        }
        
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        
        #canvas-container:active {
            cursor: grabbing;
        }

        #transform-layer {
            transform-origin: 0 0;
            width: 100%;
            height: 100%;
            position: absolute;
            transition: transform 0.1s ease-out; /* Smooth panning */
        }

        .machine-node {
            position: absolute;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            will-change: transform, opacity;
        }

        /* Interaction styling */
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .link-handle { cursor: crosshair; }
        
        /* Blur effect for Eagle/Detail view background elements */
        .blur-background { opacity: 0.3; filter: blur(2px); pointer-events: none; }
        .focused-node { z-index: 50 !important; }

        /* SVG Edges */
        #edges-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: visible;
        }
        
        path.edge-line {
            fill: none;
            stroke: #94a3b8;
            stroke-width: 3;
            marker-end: url(#arrowhead);
            transition: stroke 0.3s;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 antialiased font-sans">

    <div class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-slate-200 shadow-sm z-40 flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
            <button onclick="openModal('menuModal')" class="p-2 -ml-2 rounded-lg hover:bg-slate-100 text-slate-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 class="font-bold text-lg text-slate-800 tracking-tight">Digital Twin Annotator</h1>
        </div>
        <div class="flex items-center gap-2">
            <!-- Language Toggle -->
            <button onclick="toggleLanguage()" class="px-3 py-1.5 text-sm font-semibold rounded-md border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 transition-colors">
                <span id="langBtnText">EN | PT</span>
            </button>
            <button onclick="addNewMachineCenter()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm shadow-sm flex items-center gap-1 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span id="addNodeText">Add Machine</span>
            </button>
        </div>
    </div>

    <div id="canvas-container" onpointerdown="startPan(event)">
        <div id="transform-layer">
            <svg id="edges-svg">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
                    </marker>
                </defs>
            </svg>
            <div id="nodes-container"></div>
        </div>
    </div>

    <!-- Eagle View Return Button (Hidden by default) -->
    <button id="btnReturnEagle" onclick="closeFocus()" class="hidden fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full font-bold shadow-lg z-50 flex items-center gap-2 hover:bg-slate-700 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span id="backMapText">Back to Map</span>
    </button>

    <div id="menuModal" class="hidden fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="settingsTitle" class="font-bold text-slate-800">Settings & Data</h3>
                <button onclick="closeModal('menuModal')" class="text-slate-400 hover:text-slate-600 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="p-4 overflow-y-auto">
                <button onclick="exportData()" class="w-full text-left px-4 py-3 bg-slate-50 hover:bg-slate-100 text-slate-700 rounded-xl font-medium text-sm flex items-center justify-between border border-slate-200">
                    <span id="exportText">Export Data (JSON)</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
                <div class="mt-4">
                    <label class="w-full cursor-pointer text-left px-4 py-3 bg-slate-50 hover:bg-slate-100 text-slate-700 rounded-xl font-medium text-sm flex items-center justify-between border border-slate-200">
                        <span id="importText">Import Data</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                    </label>
                </div>
                <!-- Demo and Clear Data Buttons -->
                <button onclick="loadDemoCase()" class="w-full text-left px-4 py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-xl font-medium text-sm flex items-center justify-between border border-blue-200 mt-4">
                    <span id="demoText">Load Default Demo</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <button onclick="confirmClearAll()" class="w-full text-left px-4 py-3 bg-red-50 hover:bg-red-100 text-red-700 rounded-xl font-medium text-sm flex items-center justify-between border border-red-200 mt-2">
                    <span id="clearText">Clear All Data</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
            <div class="p-4 bg-slate-50 border-t border-slate-100">
                <button onclick="closeModal('menuModal')" id="closeSettingsBtn" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold">Close</button>
            </div>
        </div>
    </div>

    <div id="configModal" class="hidden fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 id="configTitle" class="font-bold text-lg text-slate-800">Machine Configuration</h3>
                <button onclick="closeModal('configModal')" class="text-slate-400 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 hide-scrollbar">
                <input type="hidden" id="editingMachineId">
                <div class="mb-4">
                    <label id="nameLabel" class="block text-xs font-semibold text-slate-500 uppercase mb-1">Machine Name</label>
                    <input type="text" id="machineNameInput" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                
                <!-- Metadata Fields Section -->
                <div class="mb-5 border-t border-slate-100 pt-4">
                    <div class="flex justify-between items-center mb-2">
                        <label id="metaLabel" class="block text-xs font-semibold text-slate-500 uppercase">Custom Fields (Metadata)</label>
                        <button onclick="addMetaFieldUI()" id="addMetaBtn" class="text-xs text-indigo-600 font-medium hover:text-indigo-800">+ Add Field</button>
                    </div>
                    <div id="metaListContainer" class="space-y-2"></div>
                </div>

                <!-- Categories Section -->
                <div class="mb-2 border-t border-slate-100 pt-4">
                    <div class="flex justify-between items-center mb-2">
                        <label id="catLabel" class="block text-xs font-semibold text-slate-500 uppercase">Event Categories</label>
                        <button onclick="addCategoryUI()" id="addCatBtn" class="text-xs text-indigo-600 font-medium hover:text-indigo-800">+ Add Category</button>
                    </div>
                    <div id="categoriesListContainer" class="space-y-3"></div>
                </div>
            </div>
            <div class="p-4 bg-slate-50 border-t border-slate-100 flex justify-between">
                <button onclick="deleteCurrentMachine()" id="delMachineBtn" class="px-4 py-2 text-red-600 font-medium hover:bg-red-50 rounded-lg">Delete</button>
                <button onclick="saveMachineConfig()" id="saveConfigBtn" class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Internationalization (i18n) - Default EN ---
        const i18n = {
            en: {
                addMachine: "Add Machine",
                settings: "Settings & Data",
                export: "Export Data (JSON)",
                import: "Import Data",
                clear: "Clear All Data",
                loadDemo: "Load Default Demo",
                close: "Close",
                configTitle: "Machine Configuration",
                machineName: "Machine Name",
                metaLabel: "Custom Fields (Metadata)",
                addField: "+ Add Field",
                catLabel: "Event Categories",
                addCategory: "+ Add Category",
                delete: "Delete",
                save: "Save",
                backMap: "⬅ Back to Map",
                catNamePlaceholder: "Ex: Defect Type",
                optPlaceholder: "OK, NOK, Scratch...",
                metaKeyPlaceholder: "Key (e.g. PLC_ID)",
                metaValPlaceholder: "Value",
                confirmClear: "Are you sure you want to delete all data?",
                confirmDelMachine: "Delete this machine and its connections?",
                eagleHint: "Tap to focus"
            },
            pt: {
                addMachine: "Adicionar",
                settings: "Definições e Dados",
                export: "Exportar Dados (JSON)",
                import: "Importar Dados",
                clear: "Apagar Tudo",
                loadDemo: "Carregar Exemplo Base",
                close: "Fechar",
                configTitle: "Configuração da Máquina",
                machineName: "Nome da Máquina",
                metaLabel: "Campos Customizados (Meta)",
                addField: "+ Novo Campo",
                catLabel: "Categorias de Eventos",
                addCategory: "+ Nova Categoria",
                delete: "Remover",
                save: "Gravar",
                backMap: "⬅ Voltar ao Mapa",
                catNamePlaceholder: "Ex: Tipo de Defeito",
                optPlaceholder: "OK, NOK, Risco...",
                metaKeyPlaceholder: "Chave (ex: PLC_ID)",
                metaValPlaceholder: "Valor",
                confirmClear: "Tem a certeza que quer apagar tudo?",
                confirmDelMachine: "Remover esta máquina e as ligações?",
                eagleHint: "Toque para abrir"
            }
        };

        // --- STREAMING_CHUNK:State Management & Persistence... ---
        const STORAGE_KEY = 'twin_annotator_state';
        let state = {
            nodes: [],
            edges: [],
            lang: 'en',
            ui: {
                viewMode: 'eagle', // 'eagle' or 'detail'
                focusedMachine: null // node id
            }
        };

        function t(key) {
            return i18n[state.lang][key];
        }

        function loadState() {
            const legacyState = localStorage.getItem('dtx_state');
            if(legacyState && !localStorage.getItem(STORAGE_KEY)) {
                localStorage.setItem(STORAGE_KEY, legacyState);
                localStorage.removeItem('dtx_state');
            }

            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    state.nodes = parsed.nodes || [];
                    state.edges = parsed.edges || [];
                    state.lang = parsed.lang || 'en';
                    state.ui = parsed.ui || { viewMode: 'eagle', focusedMachine: null };
                } catch (e) {
                    console.error("Error loading state", e);
                    loadDefaultINCMCase();
                }
            } else {
                loadDefaultINCMCase();
            }
            applyLanguage();
            render();

            // Restore zoom/view mode if saved in state
            if (state.ui.viewMode === 'detail' && state.ui.focusedMachine) {
                const node = state.nodes.find(n => n.id === state.ui.focusedMachine);
                if (node) {
                    setTimeout(() => {
                        centerOnNode(node);
                        document.getElementById('btnReturnEagle').classList.remove('hidden');
                    }, 50);
                } else {
                    state.ui = { viewMode: 'eagle', focusedMachine: null };
                }
            }
        }

        function saveState() {
            const dataToSave = {
                nodes: state.nodes,
                edges: state.edges,
                lang: state.lang,
                ui: state.ui
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        }

        function loadDefaultINCMCase() {
            state.nodes = [
                {
                    id: 'node_' + Date.now(),
                    name: "Lamination",
                    x: 100, y: 150,
                    metadata: { "Status": "Active" },
                    categories: [
                        { id: 'cat_1', name: 'Quality', options: ['OK', 'NOK'], events: [] }
                    ]
                },
                {
                    id: 'node_' + (Date.now()+1),
                    name: "Final Press",
                    x: 350, y: 150,
                    metadata: { "PLC_IP": "192.168.1.10", "Temp_Target": "180C" },
                    categories: [
                        { id: 'cat_2', name: 'Defects', options: ['Bubble', 'Misaligned', 'OK'], events: [] }
                    ]
                },
                {
                    id: 'node_' + (Date.now()+2),
                    name: "Quality Control",
                    x: 600, y: 150,
                    metadata: {},
                    categories: [
                        { id: 'cat_3', name: 'Final Check', options: ['Approved', 'Rejected'], events: [] }
                    ]
                }
            ];
            state.edges = [
                { source: state.nodes[0].id, target: state.nodes[1].id },
                { source: state.nodes[1].id, target: state.nodes[2].id }
            ];
            state.lang = 'en';
            state.ui = { viewMode: 'eagle', focusedMachine: null };
            saveState();
        }

        // --- STREAMING_CHUNK:Canvas Panning & Pointer Handling... ---
        let pan = { x: 0, y: 0 };
        let isPanning = false;
        let startPanPos = { x: 0, y: 0 };

        function startPan(e) {
            if (e.target.closest('.machine-node') || e.target.closest('.modal')) return;
            
            if (linkState.isLinking) {
                cancelLink();
                return;
            }

            isPanning = true;
            startPanPos = { x: e.clientX - pan.x, y: e.clientY - pan.y };
            
            if(state.ui.viewMode === 'detail') {
                closeFocus();
            }
        }

        window.addEventListener('pointermove', (e) => {
            if (isPanning) {
                pan.x = e.clientX - startPanPos.x;
                pan.y = e.clientY - startPanPos.y;
                updateTransform();
            }
            if (dragState.isDragging && dragState.nodeId) {
                const dx = (e.clientX - dragState.startX);
                const dy = (e.clientY - dragState.startY);
                
                const node = state.nodes.find(n => n.id === dragState.nodeId);
                if (node) {
                    node.x = dragState.nodeStartX + dx;
                    node.y = dragState.nodeStartY + dy;
                    const el = document.getElementById(node.id);
                    if(el) {
                        el.style.left = node.x + 'px';
                        el.style.top = node.y + 'px';
                    }
                    drawEdges();
                }
            }
        });

        window.addEventListener('pointerup', () => {
            if(isPanning) {
                isPanning = false;
            }
            if(dragState.isDragging) {
                dragState.isDragging = false;
                dragState.nodeId = null;
                saveState();
            }
        });

        function updateTransform() {
            document.getElementById('transform-layer').style.transform = `translate(${pan.x}px, ${pan.y}px)`;
        }

        function centerOnNode(node) {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            pan.x = (screenW / 2) - (node.x + 144);
            pan.y = (screenH / 4) - (node.y);
            updateTransform();
        }

        // --- STREAMING_CHUNK:Drag and Link Management... ---
        let dragState = { isDragging: false, nodeId: null, startX: 0, startY: 0, nodeStartX: 0, nodeStartY: 0 };
        let linkState = { isLinking: false, sourceId: null };

        function startDrag(e, nodeId) {
            e.stopPropagation();
            dragState.isDragging = true;
            dragState.nodeId = nodeId;
            dragState.startX = e.clientX;
            dragState.startY = e.clientY;
            
            const node = state.nodes.find(n => n.id === nodeId);
            dragState.nodeStartX = node.x;
            dragState.nodeStartY = node.y;
        }

        function startLink(e, sourceId) {
            e.stopPropagation();
            linkState.isLinking = true;
            linkState.sourceId = sourceId;
            document.getElementById('canvas-container').style.cursor = 'crosshair';
            const toast = document.createElement('div');
            toast.id = 'linkToast';
            toast.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full shadow-lg z-50 text-sm font-medium animate-pulse pointer-events-none';
            toast.innerText = state.lang === 'pt' ? 'Clique na máquina de destino' : 'Tap destination machine';
            document.body.appendChild(toast);
        }

        function cancelLink() {
            linkState.isLinking = false;
            linkState.sourceId = null;
            document.getElementById('canvas-container').style.cursor = 'grab';
            const toast = document.getElementById('linkToast');
            if(toast) toast.remove();
        }

        function handleNodeClick(e, nodeId) {
            if (linkState.isLinking) {
                e.stopPropagation();
                if (linkState.sourceId !== nodeId) {
                    const exists = state.edges.some(edge => edge.source === linkState.sourceId && edge.target === nodeId);
                    if(!exists) {
                        state.edges.push({ source: linkState.sourceId, target: nodeId });
                        saveState();
                        render();
                    }
                }
                cancelLink();
            } else {
                if (state.ui.viewMode === 'eagle' && e.target.closest('.machine-header')) {
                    focusMachine(nodeId);
                }
            }
        }

        // --- STREAMING_CHUNK:Semantic Zoom Modes... ---
        function focusMachine(nodeId) {
            state.ui.viewMode = 'detail';
            state.ui.focusedMachine = nodeId;
            saveState();
            
            const node = state.nodes.find(n => n.id === nodeId);
            if(node) centerOnNode(node);
            
            render();
            document.getElementById('btnReturnEagle').classList.remove('hidden');
        }

        function closeFocus() {
            state.ui.viewMode = 'eagle';
            state.ui.focusedMachine = null;
            saveState();
            render();
            document.getElementById('btnReturnEagle').classList.add('hidden');
        }

        // --- STREAMING_CHUNK:Dynamic UI Rendering... ---
        function render() {
            const container = document.getElementById('nodes-container');
            container.innerHTML = '';
            
            state.nodes.forEach(node => {
                const totalEvents = node.categories ? node.categories.reduce((acc, cat) => acc + (cat.events ? cat.events.length : 0), 0) : 0;
                const isFocused = state.ui.focusedMachine === node.id;
                const isEagle = state.ui.viewMode === 'eagle';
                
                let nodeClasses = "machine-node bg-white rounded-xl shadow-md border border-slate-200 flex flex-col overflow-hidden";
                if (state.ui.viewMode === 'detail' && !isFocused) {
                    nodeClasses += " blur-background";
                }
                if (isFocused) {
                    nodeClasses += " focused-node ring-4 ring-indigo-500 shadow-2xl";
                }
                
                let widthClass = (isEagle || (state.ui.viewMode === 'detail' && !isFocused)) ? "w-48" : "w-72";

                const el = document.createElement('div');
                el.id = node.id;
                el.className = `${nodeClasses} ${widthClass}`;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                el.onpointerdown = (e) => handleNodeClick(e, node.id);

                let content = '';

                // Header / Compact Eagle View State
                content += `
                    <div class="machine-header bg-slate-50 p-2 border-b border-slate-100 flex justify-between items-center ${isEagle ? 'cursor-pointer hover:bg-slate-100' : ''}" title="${isEagle ? t('eagleHint') : ''}">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <div class="drag-handle text-slate-300 hover:text-slate-500 p-1 rounded cursor-grab" onpointerdown="startDrag(event, '${node.id}')">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16"><path d="M7 2a1 1 0 11-2 0 1 1 0 012 0zm4 0a1 1 0 11-2 0 1 1 0 012 0zm-4 4a1 1 0 11-2 0 1 1 0 012 0zm4 0a1 1 0 11-2 0 1 1 0 012 0zm-4 4a1 1 0 11-2 0 1 1 0 012 0zm4 0a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
                            </div>
                            <div class="font-bold text-slate-800 text-sm truncate">${node.name}</div>
                            <div id="badge-${node.id}" class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full flex-shrink-0">
                                ${totalEvents}
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            ${isFocused ? `
                                <button onclick="openConfig('${node.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                </button>
                            ` : ''}
                            <button onpointerdown="startLink(event, '${node.id}')" class="link-handle p-1.5 text-slate-400 hover:text-green-600 hover:bg-green-50 rounded" title="Link to next machine">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                            </button>
                        </div>
                    </div>
                `;

                // Detailed Body (Only visible if focused)
                if (isFocused) {
                    content += `<div class="p-3 flex flex-col gap-3">`;
                    
                    if (node.metadata && Object.keys(node.metadata).length > 0) {
                        content += `<div class="bg-slate-50 rounded p-2 text-xs flex flex-wrap gap-2">`;
                        for (const [key, value] of Object.entries(node.metadata)) {
                            content += `<span class="bg-white border border-slate-200 px-1.5 py-0.5 rounded text-slate-600"><b>${key}:</b> ${value}</span>`;
                        }
                        content += `</div>`;
                    }

                    if (node.categories && node.categories.length > 0) {
                        node.categories.forEach(cat => {
                            content += `<div class="mb-1">
                                <div class="text-xs font-semibold text-slate-500 mb-1.5 uppercase">${cat.name}</div>
                                <div class="grid grid-cols-2 gap-2">`;
                            
                            cat.options.forEach(opt => {
                                const isOk = opt.toUpperCase() === 'OK';
                                const btnClass = isOk ? 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100' : 'bg-red-50 text-red-700 border-red-200 hover:bg-red-100';
                                
                                content += `<button onclick="logEvent(event, '${node.id}', '${cat.id}', '${opt}')" 
                                    class="border py-2 px-2 rounded-lg font-bold text-sm shadow-sm active:scale-95 transition-transform ${btnClass}">
                                    ${opt}
                                </button>`;
                            });
                            
                            content += `</div></div>`;
                        });
                    } else {
                        content += `<div class="text-center text-xs text-slate-400 py-2 italic">No categories defined.<br>Click settings icon to add.</div>`;
                    }
                    content += `</div>`;
                }

                el.innerHTML = content;
                container.appendChild(el);
            });

            setTimeout(drawEdges, 10);
        }

        // --- STREAMING_CHUNK:SVG Edge Routing... ---
        function drawEdges() {
            const svg = document.getElementById('edges-svg');
            const defs = svg.querySelector('defs').outerHTML;
            svg.innerHTML = defs;

            state.edges.forEach(edge => {
                const srcEl = document.getElementById(edge.source);
                const tgtEl = document.getElementById(edge.target);
                
                if (srcEl && tgtEl) {
                    const srcW = srcEl.offsetWidth;
                    const srcH = srcEl.offsetHeight;
                    const tgtH = tgtEl.offsetHeight;

                    const srcX = state.nodes.find(n => n.id === edge.source).x + srcW;
                    const srcY = state.nodes.find(n => n.id === edge.source).y + (srcH / 2);
                    
                    const tgtX = state.nodes.find(n => n.id === edge.target).x;
                    const tgtY = state.nodes.find(n => n.id === edge.target).y + (tgtH / 2);

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const curveOffset = Math.max(Math.abs(tgtX - srcX) / 2, 40);
                    const d = `M ${srcX} ${srcY} C ${srcX + curveOffset} ${srcY}, ${tgtX - curveOffset} ${tgtY}, ${tgtX} ${tgtY}`;
                    
                    path.setAttribute('d', d);
                    path.setAttribute('class', 'edge-line');
                    svg.appendChild(path);
                }
            });
        }

        // --- STREAMING_CHUNK:Event Logging & Real-time Counters... ---
        function logEvent(e, nodeId, catId, value) {
            e.stopPropagation();
            const node = state.nodes.find(n => n.id === nodeId);
            const cat = node.categories.find(c => c.id === catId);
            
            cat.events.push({
                timestamp: new Date().toISOString(),
                value: value
            });
            saveState();
            
            const totalEvents = node.categories.reduce((acc, c) => acc + c.events.length, 0);
            const badge = document.getElementById(`badge-${node.id}`);
            if(badge) {
                badge.innerText = totalEvents;
                badge.classList.remove('scale-150');
                void badge.offsetWidth;
                badge.classList.add('scale-150', 'transition-transform');
                setTimeout(() => badge.classList.remove('scale-150'), 200);
            }

            const btn = e.currentTarget;
            btn.classList.add('ring-4', 'ring-green-400');
            setTimeout(() => {
                btn.classList.remove('ring-4', 'ring-green-400');
            }, 300);
        }

        // --- STREAMING_CHUNK:Machine Configuration UI Logic... ---
        function addNewMachineCenter() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const targetX = (screenW / 2 - pan.x - 100);
            const targetY = (screenH / 2 - pan.y - 50);

            const newNode = {
                id: 'node_' + Date.now(),
                name: "New Machine",
                x: Math.max(0, targetX), 
                y: Math.max(0, targetY),
                metadata: {},
                categories: []
            };
            state.nodes.push(newNode);
            saveState();
            render();
            openConfig(newNode.id);
        }

        function openConfig(nodeId) {
            const node = state.nodes.find(n => n.id === nodeId);
            if (!node) return;
            
            document.getElementById('editingMachineId').value = nodeId;
            document.getElementById('machineNameInput').value = node.name;
            
            const metaContainer = document.getElementById('metaListContainer');
            metaContainer.innerHTML = '';
            if(node.metadata) {
                for(const [key, val] of Object.entries(node.metadata)) {
                    metaContainer.appendChild(createMetaUIElement(key, val));
                }
            }

            const catContainer = document.getElementById('categoriesListContainer');
            catContainer.innerHTML = '';
            if (node.categories) {
                node.categories.forEach(cat => {
                    catContainer.appendChild(createCategoryUIElement(cat.name, cat.options.join(', '), cat.id));
                });
            }
            
            openModal('configModal');
        }

        function createMetaUIElement(key = '', val = '') {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center bg-slate-50 p-2 rounded border border-slate-200 meta-item';
            div.innerHTML = `
                <input type="text" placeholder="${t('metaKeyPlaceholder')}" value="${key}" class="w-1/2 px-2 py-1 text-sm border rounded focus:outline-none meta-key">
                <input type="text" placeholder="${t('metaValPlaceholder')}" value="${val}" class="w-1/2 px-2 py-1 text-sm border rounded focus:outline-none meta-val">
                <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
            `;
            return div;
        }

        function addMetaFieldUI() {
            document.getElementById('metaListContainer').appendChild(createMetaUIElement());
        }

        function createCategoryUIElement(name = '', optionsStr = '', id = '') {
            const div = document.createElement('div');
            div.className = 'flex flex-col gap-2 bg-slate-50 p-3 rounded border border-slate-200 category-item';
            div.innerHTML = `
                <input type="hidden" class="cat-id" value="${id}">
                <div class="flex justify-between items-center">
                    <input type="text" placeholder="${t('catNamePlaceholder')}" value="${name}" class="w-full px-2 py-1 text-sm font-bold border rounded focus:outline-none cat-name">
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-400 hover:text-red-600 ml-2 p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                </div>
                <input type="text" placeholder="${t('optPlaceholder')}" value="${optionsStr}" class="w-full px-2 py-1 text-sm border rounded focus:outline-none cat-options">
            `;
            return div;
        }

        function addCategoryUI() {
            document.getElementById('categoriesListContainer').appendChild(createCategoryUIElement());
        }

        function saveMachineConfig() {
            const nodeId = document.getElementById('editingMachineId').value;
            const node = state.nodes.find(n => n.id === nodeId);
            if (!node) return;

            node.name = document.getElementById('machineNameInput').value || 'Unnamed';
            
            node.metadata = {};
            document.querySelectorAll('#metaListContainer .meta-item').forEach(el => {
                const k = el.querySelector('.meta-key').value.trim();
                const v = el.querySelector('.meta-val').value.trim();
                if (k) node.metadata[k] = v;
            });

            const newCategories = [];
            document.querySelectorAll('#categoriesListContainer .category-item').forEach(el => {
                const catIdInput = el.querySelector('.cat-id').value;
                const catName = el.querySelector('.cat-name').value;
                const optsRaw = el.querySelector('.cat-options').value;
                
                if (catName && optsRaw) {
                    const opts = optsRaw.split(',').map(s => s.trim()).filter(s => s);
                    const existingCat = node.categories.find(c => c.id === catIdInput);
                    
                    newCategories.push({
                        id: catIdInput || 'cat_' + Date.now() + Math.random().toString(36).substr(2, 9),
                        name: catName,
                        options: opts,
                        events: existingCat ? existingCat.events : []
                    });
                }
            });
            node.categories = newCategories;

            saveState();
            render();
            closeModal('configModal');
        }

        function deleteCurrentMachine() {
            if(confirm(t('confirmDelMachine'))) {
                const nodeId = document.getElementById('editingMachineId').value;
                state.nodes = state.nodes.filter(n => n.id !== nodeId);
                state.edges = state.edges.filter(e => e.source !== nodeId && e.target !== nodeId);
                
                if(state.ui.focusedMachine === nodeId) closeFocus();
                
                saveState();
                render();
                closeModal('configModal');
            }
        }

        // --- STREAMING_CHUNK:Global Utilities & Language Management... ---
        function toggleLanguage() {
            state.lang = state.lang === 'en' ? 'pt' : 'en';
            saveState();
            applyLanguage();
            render();
        }

        function applyLanguage() {
            document.getElementById('langBtnText').innerText = state.lang.toUpperCase();
            document.getElementById('addNodeText').innerText = t('addMachine');
            document.getElementById('settingsTitle').innerText = t('settings');
            document.getElementById('exportText').innerText = t('export');
            document.getElementById('importText').innerText = t('import');
            document.getElementById('clearText').innerText = t('clear');
            document.getElementById('demoText').innerText = t('loadDemo');
            document.getElementById('closeSettingsBtn').innerText = t('close');
            document.getElementById('configTitle').innerText = t('configTitle');
            document.getElementById('nameLabel').innerText = t('machineName');
            document.getElementById('metaLabel').innerText = t('metaLabel');
            document.getElementById('addMetaBtn').innerText = t('addField');
            document.getElementById('catLabel').innerText = t('catLabel');
            document.getElementById('addCatBtn').innerText = t('addCategory');
            document.getElementById('delMachineBtn').innerText = t('delete');
            document.getElementById('saveConfigBtn').innerText = t('save');
            document.getElementById('backMapText').innerText = t('backMap');
        }

        function exportData() {
            const dataToExport = {
                nodes: state.nodes,
                edges: state.edges,
                ui: state.ui
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            const dateStr = new Date().toLocaleString('sv').replace(/\D/g, '').slice(0, 12);
            downloadAnchorNode.setAttribute("download", `factory_twin_${dateStr}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const rawContent = e.target.result;
                    const importedData = JSON.parse(rawContent);

                    // Validar se tem a estrutura esperada minima
                    if (!importedData.machines || !Array.isArray(importedData.machines)) {
                        throw new Error("O ficheiro JSON não contém o formato válido de máquinas.");
                    }

                    // Carregar os dados para o state global
                    state.machines = importedData.machines;
                    if (importedData.edges) state.edges = importedData.edges;
                    if (importedData.ui) state.ui = importedData.ui;

                    // Guardar no localStorage e atualizar a interface
                    saveState();
                    render();
                    
                    // Feedback visual de sucesso
                    alert("Ficheiro importado com sucesso!");
                } catch (error) {
                    alert("Erro ao importar JSON: " + error.message);
                } finally {
                    // Limpa o input para permitir reimportar o mesmo ficheiro se necessário
                    event.target.value = '';
                }
            };

            reader.onerror = function() {
                alert("Erro ao ler o ficheiro no dispositivo.");
                event.target.value = '';
            };

            reader.readAsText(file);
        }

        function loadDemoCase() {
            if (confirm(state.lang === 'pt' ? 'Isto vai apagar o desenho atual. Continuar?' : 'This will overwrite your current layout. Continue?')) {
                loadDefaultINCMCase();
                if(state.ui.focusedMachine) closeFocus();
                render();
                closeModal('menuModal');
            }
        }

        function confirmClearAll() {
            if (confirm(t('confirmClear'))) {
                state.nodes = [];
                state.edges = [];
                state.ui = { viewMode: 'eagle', focusedMachine: null };
                saveState();
                render();
                closeModal('menuModal');
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        window.addEventListener('resize', drawEdges);
        window.onload = loadState;
    </script>
</body>
</html>
